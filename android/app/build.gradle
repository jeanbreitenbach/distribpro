plugins { id 'com.android.application' }

// Chave definitiva: os dados ficam em android/keystore.properties (fora do Git).
// Caminho alternativo pela variável de ambiente KEYSTORE_PROPERTIES.
def chaveProps = new Properties()
def chaveArq = file(System.getenv('KEYSTORE_PROPERTIES') ?: "$rootDir/keystore.properties")
if (chaveArq.exists()) chaveArq.withInputStream { chaveProps.load(it) }

android {
    namespace 'br.com.qdiqueijo.catalogo'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.qdiqueijo.catalogo'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }
    signingConfigs {
        if (chaveProps['storeFile']) {
            definitiva {
                storeFile file(chaveProps['storeFile'])
                storePassword chaveProps['storePassword']
                keyAlias chaveProps['keyAlias']
                keyPassword chaveProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (chaveProps['storeFile']) signingConfig signingConfigs.definitiva
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // O catálogo (HTML, produtos.js e fotos) vem direto de public/catalogo a cada build.
    sourceSets { main { assets.srcDirs = ["$buildDir/generated/catalogo-assets"] } }
}

tasks.register('copiarCatalogo', Copy) {
    from "$rootDir/../public/catalogo"
    into "$buildDir/generated/catalogo-assets/catalogo"
}
preBuild.dependsOn 'copiarCatalogo'
