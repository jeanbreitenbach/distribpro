<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Linha Varejo</title>
<meta name="description" content="Pães de queijo, empanados e mix congelados. Peça orçamento ou faça seu pedido pelo WhatsApp.">
<meta name="theme-color" content="#a3141a">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/catalogo/catalogo.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <div class="marca"><small>Linha</small>Varejo</div>
    <div class="busca"><input id="busca" type="search" placeholder="Buscar produto..." aria-label="Buscar produto" autocomplete="off"></div>
    <button class="btn-carrinho" id="abrirCarrinho" aria-label="Abrir carrinho">🛒 <span class="rot">Carrinho</span> <b id="qtdCarrinho">0</b></button>
  </div>
  <nav class="secoes" id="secoes" aria-label="Linhas de produto"></nav>
</header>

<main class="conteudo">
  <p class="status" id="status">Carregando preços e estoque...</p>
  <div id="lista"></div>
</main>

<footer class="rodape">
  <p>Imagens ilustrativas. Preços e disponibilidade sujeitos a confirmação no fechamento do pedido.</p>
</footer>

<a class="whats-flutuante" id="whatsFlutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-1-2.2-1.1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.7s1.2 3.2 1.3 3.4c.2.2 2.3 3.5 5.6 4.9 2.1.9 2.9 1 4 .8.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
  <span id="whatsFlutuanteTxt">Falar com o atendente</span>
</a>

<dialog id="janelaProduto" class="janela" aria-labelledby="pTitulo"></dialog>
<dialog id="janelaCarrinho" class="janela gaveta" aria-labelledby="cTitulo"></dialog>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="/catalogo-dados.js" charset="utf-8"></script>
<script src="/catalogo/catalogo.js" charset="utf-8"></script>
</body>
</html>
