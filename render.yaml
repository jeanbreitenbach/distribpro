# Blueprint do Render — https://render.com/docs/blueprint-spec
# Publicar: https://render.com/deploy?repo=https://github.com/jeanbreitenbach/distribpro
services:
  - type: web
    name: distribpro
    runtime: node
    plan: starter            # o plano gratuito não tem disco persistente (os dados seriam apagados)
    region: virginia
    buildCommand: echo "sem etapa de build"
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_FILE
        value: /var/data/distribpro.db
      - key: TRUST_PROXY
        value: "1"
      - key: DADOS_INICIAIS
        value: vazio
      - key: ADMIN_EMAIL
        sync: false           # o Render pede o valor na criação
      - key: ADMIN_SENHA
        sync: false
      - key: NFE_PROVEDOR
        value: simulado
